name: spendwise
description: "SpendWise - Personal Expense Tracker Offline-First"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Database Lokal & Path
  sqflite: ^2.3.0
  path: ^1.9.0
  # Notifikasi Lokal Mandiri
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2
  # Modul 2 (Kamera & OCR)
  image_picker: ^1.0.7
  google_mlkit_text_recognition: ^0.17.1
  # Modul 3 (Grafik & Ekspor PDF)
  fl_chart: ^0.66.0
  pdf: ^3.10.8
  printing: ^5.12.0
  # Utilities
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true